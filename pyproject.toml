[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ami-knowledge-core"
version = "0.1.0"
description = "Provenance-first knowledge layer for the AMI ecosystem"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "AMI Project" }]
dependencies = [
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
ami-kc-serve = "ami_knowledge_core.api.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ami_knowledge_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM117"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ami_knowledge_core"]

[[tool.mypy.overrides]]
module = ["ami_knowledge_core.api.app"]
disallow_untyped_decorators = false
