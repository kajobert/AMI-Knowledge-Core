<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AMI Encyclopedia</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>AMI Encyclopedia</h1>
        <p>Knowledge Core · read-first archaeology UI · sanitized fixture preview</p>
      </div>
      <form id="global-search" class="global-search" role="search">
        <input id="search-input" type="search" placeholder="Global search (sources, claims, concepts, evidence)…" />
        <button type="submit">Search</button>
      </form>
      <div id="health" class="health">Checking…</div>
    </header>

    <div class="layout">
      <nav class="sidebar" id="sidebar">
        <button data-view="matrix" class="active">Evidence / Reality Matrix</button>
        <button data-view="graph">Concept graph</button>
        <button data-view="sources">Sources</button>
        <button data-view="claims">Claims</button>
        <button data-view="timeline">Timeline</button>
        <button data-view="worker">Worker / Ingest</button>
      </nav>

      <main id="workspace" class="workspace" aria-live="polite"></main>

      <aside id="inspector" class="inspector" aria-label="Inspector">
        <header>
          <h2>Inspector</h2>
          <p id="inspector-subtitle" class="muted">Select a node or search result</p>
        </header>
        <nav id="inspector-chain" class="chain"></nav>
        <div id="inspector-body" class="inspector-body"></div>
      </aside>
    </div>

    <script type="module" src="/static/encyclopedia.js"></script>
  </body>
</html>
